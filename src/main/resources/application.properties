spring.application.name=merchant

server.port=8082

# DynamoDB Local (repositorio infraestructure)
aws.dynamodb.endpoint=http://localhost:8000
aws.dynamodb.region=eu-west-1
aws.dynamodb.table-name=MainTable
aws.dynamodb.access-key=local
aws.dynamodb.secret-key=local

# Llamadas a client-microservice (Feign)
client.service.url=http://localhost:8081
spring.cloud.openfeign.client.config.client-service.connect-timeout=2000
spring.cloud.openfeign.client.config.client-service.read-timeout=3000

# JWT (interceptor de edad). La clave debe ser la misma que en client-microservice
